<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/120.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Otix is your personal media command center — track movies, shows, games, and music, log workouts, and discover your next obsession." />
    <meta property="og:site_name" content="Otix" />
    <meta property="og:image" content="/icons/512.png" />
    <meta name="msapplication-TileImage" content="/icons/512.png" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" /></noscript>
    <title>Otix</title>
    <link rel="stylesheet" href="/src/styles/init.scss" />
    <script>
      (function() {
        try {
          var isProd = '%PROD%' === 'true';
          var saved = localStorage.getItem('otix-theme');
          var isDark = true;
          if (!isProd) {
            if (saved === 'light') {
              isDark = false;
            } else if (saved === 'system') {
              isDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : true;
            }
          }
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loading-screen" aria-hidden="true">
      <div class="app-loading-pod">
        <svg class="app-loading-logo" viewBox="0 0 2048 2048" fill="currentColor">
          <circle cx="1024" cy="1024" r="484" fill="none" stroke="currentColor" stroke-width="140"/>
          <path fill="none" stroke="currentColor" stroke-width="120" stroke-linecap="round" stroke-linejoin="round" d="M1024 1024 C800 652 460 652 420 1024 C460 1396 800 1396 1024 1024 C1248 652 1588 652 1628 1024 C1588 1396 1248 1396 1024 1024"/>
        </svg>
        <div class="app-loading-text">Starting Otix…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
