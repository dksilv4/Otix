; Otix plugin host — supervisord program.
;
; Supervise ONLY the plugin host. Plugin code runs in-process, so the worst a
; bad plugin can do is take this service down; supervisord restarts it and the
; Django API / DB are untouched. The host is stateless (re-reads enabled Plugin
; rows from the DB on every boot), so restarts are always safe.
;
; Install: cp plugin-host.supervisor.conf /etc/supervisor/conf.d/ && supervisorctl update
[program:plugin-host]
command=/opt/otix/backend/.venv/bin/python manage.py plugin_host
directory=/opt/otix/backend
environment=DJANGO_SETTINGS_MODULE="config.settings.prod",PLUGIN_EVENTS_URL="redis://127.0.0.1:6379/0",PLUGIN_HOST_SECRET="change-me"
autostart=true
autorestart=true
startsecs=3
; SIGTERM propagates to the whole process group so the host exits cleanly.
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/otix/plugin-host.log
stderr_logfile=/var/log/otix/plugin-host.log
