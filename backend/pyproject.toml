[project]
name = "otix"
version = "0.1.22"
description = "Django + DRF rewrite of the Otix media library/tracking platform backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.7",
    # pgvector-python bundles Django ORM support (`pgvector.django` VectorField).
    # There is no separate "django-pgvector" package on PyPI.
    "pgvector>=0.3,<0.6",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "python-dotenv>=1.0",
    "pyjwt>=2.13.0",
    "pyotp>=2.10.0",
    "qrcode>=8.2",
    "pyyaml>=6.0.3",
    # ASGI server (config.asgi) — SSE streaming + reload/dev, see ARCHITECTURE §7.
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28.1",
    # Web-push delivery for release notifications (apps.push.services.sender).
    "pywebpush>=2.0",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*", "scripts/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "E501"]  # Allow Callable() defaults and relax line-length.

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "core", "plugins"]
