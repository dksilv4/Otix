[project]
name = "otix"
version = "0.2.9"
description = "Otix media tracking and discovery platform"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "celery[redis]>=5.4,<6.0",
    "redis[hiredis]>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "python-multipart>=0.0.9",
    "structlog>=24.0,<25.0",
    "httptools>=0.6,<1.0",
    "orjson>=3.10,<4.0",
    "resend>=1.0,<2.0",
    "email-validator>=2.1,<3.0",
    "qrcode>=8.0,<9.0",
    "fastembed>=0.4,<1.0",
    "pgvector>=0.3,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-httpx>=0.30,<1.0",
    "pytest-cov>=5.0,<6.0",
    "fakeredis[lua]>=2.20,<3.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=4.0,<5.0",
]

[tool.setuptools.packages.find]
include = ["otix*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker services (db, redis)",
]

[tool.coverage.run]
branch = true
source = ["otix"]
omit = [
    "otix/providers/*",
    "otix/tasks/*",
    "otix/alembic/*",
    "otix/services/*_sync_service.py",
    "otix/services/*_auth_service.py",
    "otix/services/*_library_service.py",
    "otix/services/*_resolver.py",
    "otix/services/*_rating_service.py",
    "otix/services/google_auth_service.py",
    "otix/api/*",
    "otix/infrastructure/*",
    "otix/lib/*_progress.py",
    "otix/lib/media_rehydrate_progress.py",
    "otix/services/personalization_service.py",
    "otix/services/embedding_service.py",
    "otix/services/admin_edit_service.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
]
