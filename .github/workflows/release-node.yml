name: Release Otix Node

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. v0.1.26)"
        required: false
        type: string
        default: "v0.1.26"
      push_images:
        description: "Push Node Docker image to GHCR"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  prepare-release:
    name: Initialize Release & Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.val }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: tag
        shell: bash
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}"
          echo "val=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG="${{ steps.tag.outputs.val }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## Otix Release ${CURRENT_TAG}" > release_notes.md
          echo "" >> release_notes.md
          echo "### 🚀 What's Changed" >> release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "---" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}" >> release_notes.md
          else
            git log -n 50 --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
          fi

      - name: Create or Update GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.val }}
          name: "Release ${{ steps.tag.outputs.val }}"
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node-packages:
    name: Build & Release Otix Node Installers (Mac, Windows, Linux)
    needs: [prepare-release]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: node/go.sum

      - name: Build all packages (DMG, ZIP, Tarballs)
        working-directory: node
        run: |
          chmod +x scripts/build-all.sh scripts/build-macos.sh
          ./scripts/build-all.sh

      - name: Copy Unraid template to dist
        run: cp node/unraid/my-otix-server.xml node/dist/my-otix-server.xml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otix-node-installers
          path: |
            node/dist/Otix-Node.dmg
            node/dist/Otix-Node-Windows-x64.zip
            node/dist/Otix-Node-Linux-x64.tar.gz
            node/dist/Otix-Node-Linux-arm64.tar.gz
            node/dist/my-otix-server.xml
          retention-days: 14

      - name: Attach Installers to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          files: |
            node/dist/Otix-Node.dmg
            node/dist/Otix-Node-Windows-x64.zip
            node/dist/Otix-Node-Linux-x64.tar.gz
            node/dist/Otix-Node-Linux-arm64.tar.gz
            node/dist/my-otix-server.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node-docker:
    name: Package & Release Otix Node Docker Image
    needs: [prepare-release]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.push_images }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Node Docker
        id: meta-node
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/otix-node
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version_tag }},enable=${{ inputs.version_tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != '' }}
            type=sha,format=short

      - name: Build and push Node Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./node
          file: ./node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-node.outputs.tags }}
          labels: ${{ steps.meta-node.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
