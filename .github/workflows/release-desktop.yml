name: Release Otix Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. v0.1.26)"
        required: false
        type: string
        default: "v0.1.26"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Initialize Release & Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.val }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: tag
        shell: bash
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}"
          echo "val=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG="${{ steps.tag.outputs.val }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## Otix Release ${CURRENT_TAG}" > release_notes.md
          echo "" >> release_notes.md
          echo "### 🚀 What's Changed" >> release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "---" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}" >> release_notes.md
          else
            git log -n 50 --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
          fi

      - name: Create or Update GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.val }}
          name: "Release ${{ steps.tag.outputs.val }}"
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-frontend:
    name: Build Frontend UI (for Desktop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build static bundle
        working-directory: frontend
        run: npm run build

      - name: Create static tarball
        run: tar -czf otix-frontend-dist.tar.gz -C frontend/dist .

      - name: Upload static tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: otix-frontend-dist
          path: otix-frontend-dist.tar.gz
          retention-days: 1

  desktop-packages:
    name: Build & Release Otix Desktop (${{ matrix.os }})
    needs: [build-frontend, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: "--mac"
            artifact_pattern: |
              desktop/release/*.dmg
              desktop/release/*.zip
              desktop/release/latest-mac.yml
          - os: windows-2022
            target: "--win"
            artifact_pattern: |
              desktop/release/*.exe
              desktop/release/*.blockmap
              desktop/release/latest.yml
          - os: ubuntu-latest
            target: "--linux"
            artifact_pattern: |
              desktop/release/*.AppImage
              desktop/release/*.deb
              desktop/release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    env:
      GYP_MSVS_VERSION: "2022"
      npm_config_msvs_version: "2022"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: "2022"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Download Frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: otix-frontend-dist
          path: frontend-temp

      - name: Unpack Frontend dist
        shell: bash
        run: |
          mkdir -p frontend/dist
          tar -xzf frontend-temp/otix-frontend-dist.tar.gz -C frontend/dist

      - name: Install Desktop dependencies
        working-directory: desktop
        shell: bash
        run: |
          npm ci --legacy-peer-deps
          npx electron-builder install-app-deps

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: node/go.sum

      - name: Build Embedded Node Companion
        shell: bash
        run: |
          mkdir -p desktop/bin
          case "${{ matrix.os }}" in
            windows*)
              (cd node && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../desktop/bin/otix-node.exe ./main.go)
              ;;
            macos-latest)
              (cd node && CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../desktop/bin/otix-node-arm64 ./main.go)
              (cd node && CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../desktop/bin/otix-node-amd64 ./main.go)
              lipo -create -output desktop/bin/otix-node desktop/bin/otix-node-arm64 desktop/bin/otix-node-amd64
              rm desktop/bin/otix-node-arm64 desktop/bin/otix-node-amd64
              chmod +x desktop/bin/otix-node
              ;;
            ubuntu-latest)
              (cd node && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../desktop/bin/otix-node ./main.go)
              chmod +x desktop/bin/otix-node
              ;;
          esac

      - name: Build & Package Desktop Client
        working-directory: desktop
        shell: bash
        run: |
          npm run build
          npx electron-builder ${{ matrix.target }} -c electron-builder.json5 --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otix-desktop-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}
          retention-days: 14

      - name: Attach Desktop Binaries to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          files: ${{ matrix.artifact_pattern }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
