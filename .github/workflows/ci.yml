name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint 2>/dev/null || echo "No lint script configured"

      - name: Unit tests
        run: npm test 2>/dev/null || echo "No test script configured"

  # Django backend (backend/). The suite is hermetic: config.settings.test
  # forces an in-memory SQLite test DB + eager Celery, and the Redis-backed
  # surfaces (SSE/sync/rate-limit) run against in-memory doubles — so no
  # Postgres/Redis services are required. The legacy FastAPI tree now lives at
  # old-backend/ and is retired from CI (not built or tested here).
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Add the project venv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: ruff check .

      - name: No migration drift
        run: python manage.py makemigrations --check --dry-run

      # Frozen contract gate: the route contract must stay 263/263 served with
      # zero method-gaps / remaining routes (scripts/parity_report.py).
      - name: Frozen route-contract parity
        run: |
          python scripts/parity_report.py | tee parity.txt
          grep -qE "method-gaps: 0; remaining: 0" parity.txt

      - name: Unit tests
        run: python manage.py test
