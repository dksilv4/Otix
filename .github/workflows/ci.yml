name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint 2>/dev/null || echo "No lint script configured"

      - name: Unit tests
        run: npm test 2>/dev/null || echo "No test script configured"

  # Legacy FastAPI tree (backend/ renamed to old-backend/ in the Django
  # cutover). This job keeps validating the legacy code it runs; a Django CI job
  # (manage.py test + ruff + makemigrations check) is a deferred follow-up.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: old-backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: otix_test
          POSTGRES_USER: otix
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otix -d otix_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .[dev]

      - name: Verify migrations apply to an empty database
        run: python scripts/migrate-check.py
        env:
          DATABASE_URL_SYNC: postgresql://otix:password@localhost:5432/otix_test
          APP_ENV: test

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy otix/ --config-file pyproject.toml

      - name: Unit tests
        run: pytest tests/unit/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://otix:password@localhost:5432/otix_test
          DATABASE_URL_SYNC: postgresql://otix:password@localhost:5432/otix_test
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET_KEY: ci-test-key-do-not-use-in-prod
          APP_ENV: test
