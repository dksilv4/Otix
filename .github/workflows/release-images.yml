name: Release Otix (Desktop & Node)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. v0.1.23)"
        required: false
        type: string
        default: "v0.1.23"
      push_images:
        description: "Push Node Docker image to GHCR"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  prepare-release:
    name: Initialize Release & Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.val }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: tag
        shell: bash
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}"
          echo "val=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG="${{ steps.tag.outputs.val }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## Otix Release ${CURRENT_TAG}" > release_notes.md
          echo "" >> release_notes.md
          echo "### 🚀 What's Changed" >> release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "---" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}" >> release_notes.md
          else
            git log -n 50 --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
          fi

      - name: Create or Update GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.val }}
          name: "Release ${{ steps.tag.outputs.val }}"
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-frontend:
    name: Build Frontend UI (for Desktop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build static bundle
        working-directory: frontend
        run: npm run build

      - name: Create static tarball
        run: tar -czf otix-frontend-dist.tar.gz -C frontend/dist .

      - name: Upload static tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: otix-frontend-dist
          path: otix-frontend-dist.tar.gz
          retention-days: 1

  node-packages:
    name: Build & Release Otix Node Installers (Mac, Windows, Linux)
    needs: [prepare-release]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: node/go.sum

      - name: Build all packages (DMG, ZIP, Tarballs)
        working-directory: node
        run: |
          chmod +x scripts/build-all.sh scripts/build-macos.sh
          ./scripts/build-all.sh

      - name: Copy Unraid template to dist
        run: cp node/unraid/my-otix-server.xml node/dist/my-otix-server.xml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otix-node-installers
          path: |
            node/dist/Otix-Node.dmg
            node/dist/Otix-Node-Windows-x64.zip
            node/dist/Otix-Node-Linux-x64.tar.gz
            node/dist/Otix-Node-Linux-arm64.tar.gz
            node/dist/my-otix-server.xml
          retention-days: 14

      - name: Attach Installers to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          files: |
            node/dist/Otix-Node.dmg
            node/dist/Otix-Node-Windows-x64.zip
            node/dist/Otix-Node-Linux-x64.tar.gz
            node/dist/Otix-Node-Linux-arm64.tar.gz
            node/dist/my-otix-server.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node-docker:
    name: Package & Release Otix Node Docker Image
    needs: [prepare-release]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.push_images }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Node Docker
        id: meta-node
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/otix-node
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version_tag }},enable=${{ inputs.version_tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != '' }}
            type=sha,format=short

      - name: Build and push Node Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./node
          file: ./node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-node.outputs.tags }}
          labels: ${{ steps.meta-node.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop-packages:
    name: Build & Release Otix Desktop (${{ matrix.os }})
    needs: [build-frontend, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: "--mac"
            artifact_pattern: |
              desktop/release/*.dmg
              desktop/release/*.zip
              desktop/release/latest-mac.yml
          - os: windows-latest
            target: "--win"
            artifact_pattern: |
              desktop/release/*.exe
              desktop/release/*.blockmap
              desktop/release/latest.yml
          - os: ubuntu-latest
            target: "--linux"
            artifact_pattern: |
              desktop/release/*.AppImage
              desktop/release/*.deb
              desktop/release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Download Frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: otix-frontend-dist
          path: frontend-temp

      - name: Unpack Frontend dist
        shell: bash
        run: |
          mkdir -p frontend/dist
          tar -xzf frontend-temp/otix-frontend-dist.tar.gz -C frontend/dist

      - name: Install Desktop dependencies
        working-directory: desktop
        shell: bash
        run: npm ci --legacy-peer-deps

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: node/go.sum

      - name: Build Embedded Node Companion
        shell: bash
        run: |
          mkdir -p desktop/bin
          case "${{ matrix.os }}" in
            windows-latest)
              (cd node && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../desktop/bin/otix-node.exe ./main.go)
              ;;
            macos-latest)
              (cd node && CGO_ENABLED=0 go build -ldflags="-s -w" -o ../desktop/bin/otix-node ./main.go)
              chmod +x desktop/bin/otix-node
              ;;
            ubuntu-latest)
              (cd node && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../desktop/bin/otix-node ./main.go)
              chmod +x desktop/bin/otix-node
              ;;
          esac

      - name: Build & Package Desktop Client
        working-directory: desktop
        shell: bash
        run: |
          npm run build
          npx electron-builder ${{ matrix.target }} -c electron-builder.json5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otix-desktop-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}
          retention-days: 14

      - name: Attach Desktop Binaries to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          files: ${{ matrix.artifact_pattern }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
