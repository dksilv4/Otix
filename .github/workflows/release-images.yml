name: Release Images & Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. v0.0.1)"
        required: false
        type: string
        default: "v0.0.1"
      push_images:
        description: "Push images to GHCR"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  frontend:
    name: Package & Release Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build static bundle
        working-directory: frontend
        run: npm run build

      - name: Create static tarball
        run: tar -czf otix-frontend-dist.tar.gz -C frontend/dist .

      - name: Upload static tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: otix-frontend-dist
          path: otix-frontend-dist.tar.gz
          retention-days: 14

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' || inputs.push_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Frontend Docker
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/otix-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version_tag }},enable=${{ inputs.version_tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != '' }}
            type=sha,format=short

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push_images }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach tarball to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}
          name: "Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}"
          generate_release_notes: true
          files: otix-frontend-dist.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Package & Release Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' || inputs.push_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend Docker
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/otix-backend
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version_tag }},enable=${{ inputs.version_tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != '' }}
            type=sha,format=short

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push_images }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  node-packages:
    name: Build & Release Otix Node Installers (Mac, Windows, Linux)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: node/go.sum

      - name: Build all packages (DMG, ZIP, Tarballs)
        working-directory: node
        run: |
          chmod +x scripts/build-all.sh scripts/build-macos.sh
          ./scripts/build-all.sh

      - name: Copy Unraid template to dist
        run: cp node/unraid/my-otix-server.xml node/dist/my-otix-server.xml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otix-node-installers
          path: |
            node/dist/Otix-Node.dmg
            node/dist/Otix-Node-Windows-x64.zip
            node/dist/Otix-Node-Linux-x64.tar.gz
            node/dist/Otix-Node-Linux-arm64.tar.gz
            node/dist/my-otix-server.xml
          retention-days: 14

      - name: Attach Installers to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}
          name: "Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}"
          generate_release_notes: true
          files: |
            node/dist/Otix-Node.dmg
            node/dist/Otix-Node-Windows-x64.zip
            node/dist/Otix-Node-Linux-x64.tar.gz
            node/dist/Otix-Node-Linux-arm64.tar.gz
            node/dist/my-otix-server.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node-docker:
    name: Package & Release Otix Node Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' || inputs.push_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Node Docker
        id: meta-node
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/otix-node
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version_tag }},enable=${{ inputs.version_tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_tag != '' }}
            type=sha,format=short

      - name: Build and push Node Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./node
          file: ./node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push_images }}
          tags: ${{ steps.meta-node.outputs.tags }}
          labels: ${{ steps.meta-node.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop-packages:
    name: Build & Release Otix Desktop (${{ matrix.os }})
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: "--mac"
            artifact_pattern: |
              desktop/release/*.dmg
              desktop/release/*.zip
          - os: windows-latest
            target: "--win"
            artifact_pattern: |
              desktop/release/*.exe
          - os: ubuntu-latest
            target: "--linux"
            artifact_pattern: |
              desktop/release/*.AppImage
              desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Download Frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: otix-frontend-dist
          path: frontend-temp

      - name: Unpack Frontend dist
        shell: bash
        run: |
          mkdir -p frontend/dist
          tar -xzf frontend-temp/otix-frontend-dist.tar.gz -C frontend/dist

      - name: Install Desktop dependencies
        working-directory: desktop
        shell: bash
        run: npm ci --legacy-peer-deps

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: node/go.sum

      - name: Build Embedded Node Companion
        shell: bash
        run: |
          mkdir -p desktop/bin
          case "${{ matrix.os }}" in
            windows-latest)
              (cd node && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../desktop/bin/otix-node.exe ./main.go)
              ;;
            macos-latest)
              (cd node && CGO_ENABLED=0 go build -ldflags="-s -w" -o ../desktop/bin/otix-node ./main.go)
              chmod +x desktop/bin/otix-node
              ;;
            ubuntu-latest)
              (cd node && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../desktop/bin/otix-node ./main.go)
              chmod +x desktop/bin/otix-node
              ;;
          esac

      - name: Build & Package Desktop Client
        working-directory: desktop
        shell: bash
        run: |
          npm run build
          npx electron-builder ${{ matrix.target }} -c electron-builder.json5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otix-desktop-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}
          retention-days: 14

      - name: Attach Desktop Binaries to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}
          name: "Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag }}"
          generate_release_notes: true
          files: ${{ matrix.artifact_pattern }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

