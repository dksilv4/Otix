[project]
name = "otix"
version = "0.1.0"
description = "Django + DRF rewrite of the Otix media library/tracking platform backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.7",
    # pgvector-python bundles Django ORM support (`pgvector.django` VectorField).
    # There is no separate "django-pgvector" package on PyPI.
    "pgvector>=0.3,<0.6",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # Allow Callable() defaults used in some view signatures.
