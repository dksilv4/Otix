# Otix Standalone Game & Save Server Configuration
server:
  name: "DK Game Storage Server"
  port: 8000
  auth_token: "otix_secret_token_abc123"
  registry_url: "https://api.otix.io"
  enable_upnp: true
  enable_heartbeat: true
  downloads_path: "./storage/downloads"

game_libraries:
  - name: "PC Installers & ISOs"
    path: "./storage/installers"
    allowed_extensions: [".iso", ".img", ".exe", ".zip", ".7z", ".rar"]
  - name: "Console ROMs"
    path: "./storage/roms"
    allowed_extensions: [".iso", ".zip", ".7z", ".chd", ".rvz"]

saves:
  storage_path: "./storage/saves"
  max_snapshots_per_game: 10
  auto_backup_on_exit: true

usenet:
  enabled: false
  sabnzbd:
    host: "127.0.0.1"
    port: 8080
    api_key: ""
    use_ssl: false
    category: "games"
    # Provider-specific mappings. Add one pair per shared completed folder.
    # Leave the list empty to auto-discover SABnzbd's main completed folder.
    path_mappings: []
    # Example:
    # path_mappings:
    #   - remote_path: "/downloads/complete/games"
    #     host_path: "/mnt/sabnzbd/complete/games"

radarr:
  enabled: false
  host: "127.0.0.1"
  port: 7878
  api_key: ""
  use_ssl: false
  url_base: ""
  quality_profile_id: 1
  root_folder_path: "/movies"
  minimum_availability: "announced"

sonarr:
  enabled: false
  host: "127.0.0.1"
  port: 8989
  api_key: ""
  use_ssl: false
  url_base: ""
  quality_profile_id: 1
  root_folder_path: "/tv"
  series_type: "standard"
  season_folder: true
