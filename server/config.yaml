server:
  name: DK Game Storage Server
  port: 8090
  host: 0.0.0.0
  auth_token: otix_secret_token_abc123
  registry_url: http://127.0.0.1:8000/api
  enable_upnp: false
  enable_heartbeat: true
  downloads_path: ./storage/downloads
game_libraries:
- name: PC Installers & ISOs
  path: ./storage/installers
  allowed_extensions:
  - .iso
  - .img
  - .exe
  - .zip
  - .7z
  - .rar
- name: Console ROMs
  path: ./storage/roms
  allowed_extensions:
  - .iso
  - .zip
  - .7z
  - .chd
  - .rvz
- name: SABnzbd Completed Games
  path: /server/Downloads
  allowed_extensions:
  - .iso
  - .img
  - .exe
  - .zip
  - .7z
  - .rar
  - .chd
  - .rvz
- name: SABnzbd Completed Games (2)
  path: /server/Games
  allowed_extensions:
  - .iso
  - .img
  - .exe
  - .zip
  - .7z
  - .rar
  - .chd
  - .rvz
- name: Local Games
  path: /games
  allowed_extensions:
  - .iso
  - .img
  - .exe
  - .zip
  - .7z
  - .rar
  - .chd
  - .rvz
saves:
  storage_path: ./storage/saves
  max_snapshots_per_game: 10
  auto_backup_on_exit: true
usenet:
  enabled: false
  sabnzbd:
    host: server.diogodasilva.com
    port: 443
    url_base: /sabnzbd
    api_key: 24b204f4b0634ffca64e4c6f5b920acc
    use_ssl: true
    category: games
    complete_dir: /Downloads/Complete
    local_complete_dir: ''
    remote_path: /Downloads
    host_path: /server/Downloads
    linked_library_path: /server/Downloads
    path_mappings:
    - remote_path: /Downloads
      host_path: /server/Downloads
    - remote_path: /Games
      host_path: /server/Games
  prowlarr:
    host: server.diogodasilva.com
    port: 443
    url_base: /prowlarr
    api_key: 4e03935ffed34d0a887df2f938dd724e
    use_ssl: true
    categories:
    - 1000
    - 4000
radarr:
  enabled: true
  host: server.diogodasilva.com
  port: 443
  url_base: /radarr/main
  api_key: 0ca18af25cc84fefb065996f68a10098
  use_ssl: true
  quality_profile_id: 5
  root_folder_path: /Media/Movies
  minimum_availability: announced
sonarr:
  enabled: true
  host: server.diogodasilva.com
  port: 443
  url_base: /sonarr/main
  api_key: e98f5a0dcaef46f5ab41a0d9854dc7f4
  use_ssl: true
  quality_profile_id: 5
  root_folder_path: /Media/Shows
  series_type: standard
  season_folder: true
  language_profile_id: null
