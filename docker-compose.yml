# Otix — production compose
# Database: Supabase (eu-central-1)  |  Redis: Upstash
# All services read DATABASE_URL, REDIS_URL, etc. from .env

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file: ./.env
    environment:
      FASTEMBED_CACHE_PATH: /app/.fastembed_cache
      OMP_NUM_THREADS: "1"
    command: bash entrypoints/start-api.sh
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  # ── Celery workers (all queues, single process per purpose) ──

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    env_file: ./.env
    environment:
      APP_ENV: development
      CELERY_WORKER_PREFETCH_MULTIPLIER: "4"
      FASTEMBED_CACHE_PATH: /app/.fastembed_cache
      OMP_NUM_THREADS: "1"
      OMP_WAIT_POLICY: PASSIVE
    command: >
      celery -A otix.infrastructure.celery worker
      -Q ingest-tmdb,ingest-steam,ingest-igdb,ingest-musicbrainz,ingest-deezer,
         enrich-fanart,enrich-omdb,enrich-steamgrid,enrich-lastfm,enrich-theaudiodb,enrich-lrclib,
         reactive-fast,reactive-user,maintain,embedding
      -c 6 -n otix-worker@%h --loglevel WARNING --pool=threads
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    env_file: ./.env
    environment:
      APP_ENV: development
    command: celery -A otix.infrastructure.celery beat --loglevel INFO --scheduler celery.beat.Scheduler --max-interval 30
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  bots:
    build:
      context: .
      dockerfile: bots/Dockerfile
    environment:
      BOT_API_BASE_URL: http://api:8000/api
      BOT_COUNT: "0"
      BOT_ACTIVE_POOL: "30"
      BOT_ACTION_BURST: "3"
      BOT_COOLDOWN_MIN: "30"
      BOT_COOLDOWN_MAX: "60"
      BOT_DELAY_MIN: "3"
      BOT_DELAY_MAX: "15"
      BOT_STARTUP_STAGGER: "120"
      BOT_API_TIMEOUT: "45"
      BOT_HTTP_POOL_LIMIT: "300"
      BOT_HTTP_POOL_PER_HOST: "200"
      BOT_LOG_DIR: /app/logs
    volumes:
      - bot_logs:/app/logs
    depends_on:
      - api

volumes:
  bot_logs:
