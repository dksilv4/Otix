# Otix — local development compose
# All services read DATABASE_URL, REDIS_URL, etc. from .env

services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: otix
      POSTGRES_PASSWORD: password
      POSTGRES_DB: otix_dev
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=50
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=5242kB
      -c huge_pages=off
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    volumes:
      # Fresh volume for the Django cutover; the legacy alembic `otix_pgdata`
      # volume is intentionally left orphaned (never mounted) so the FastAPI
      # schema + data stay intact until a real data migration.
      - pgdata_django:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otix -d otix_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file: ./.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Override .env's asyncpg FastAPI URL — Django's parser only accepts
      # plain postgresql:// (see config/settings/base.py parse_database_url).
      DATABASE_URL: postgresql://otix:password@db:5432/otix_dev
      # Request-path dispatches (e.g. a follow enqueuing a company sync, or
      # POST /api/v1/sync/...) publish through the broker; the settings default
      # is 127.0.0.1, which is unreachable inside the container.
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/1
      ENABLE_RELOAD: "true"
      # Loopback storage URLs entered in the UI (127.0.0.1:8090) are rewritten
      # to this compose hostname so the API container can reach otix-server.
      OTIX_SERVER_DOCKER_HOST: storage-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: bash entrypoints/start-api.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  # ── Celery worker + beat ──
  # The Django task surface is small so far (run_sync_job on the default
  # queue); the worker consumes `celery` only. As task-#6 machinery (ingest/
  # enrich/embedding queues) lands, grow -Q here to match. Beat runs the
  # catalog daily-import / backlog-drain / discover-artwork sweep (see
  # CELERY_BEAT_SCHEDULE in config/settings/base.py).
  #
  # Both worker and beat must point their result backend at the real Redis:
  # beat's schedule sends call the result backend (apply_async -> on_task_call),
  # and the settings default is 127.0.0.1, which is unreachable inside either
  # container. Omit it here and every scheduled task dies with "Retry limit
  # exceeded while trying to reconnect to the Celery result store".

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file: ./.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgresql://otix:password@db:5432/otix_dev
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/1
    command: celery -A config worker -Q celery -c 2 -n otix-worker@%h --loglevel INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file: ./.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgresql://otix:password@db:5432/otix_dev
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/1
    command: celery -A config beat --loglevel INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  bots:
    build:
      context: .
      dockerfile: bots/Dockerfile
    environment:
      BOT_API_BASE_URL: http://api:8000/api/v1
      BOT_COUNT: "0"
      BOT_ACTIVE_POOL: "30"
      BOT_ACTION_BURST: "3"
      BOT_COOLDOWN_MIN: "30"
      BOT_COOLDOWN_MAX: "60"
      BOT_DELAY_MIN: "3"
      BOT_DELAY_MAX: "15"
      BOT_STARTUP_STAGGER: "120"
      BOT_API_TIMEOUT: "45"
      BOT_HTTP_POOL_LIMIT: "300"
      BOT_HTTP_POOL_PER_HOST: "200"
      BOT_LOG_DIR: /app/logs
    volumes:
      - bot_logs:/app/logs
    depends_on:
      - api

  storage-server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "8090:8090"
    volumes:
      - ./server:/app
      # Host folders visible in the node file browser.
      # D:\Games → /games
      # \\SERVER\Games → /server/Games
      # \\SERVER\Downloads → /server/Downloads
      - ${OTIX_NODE_GAMES:-D:/Games}:/games
      - server_games:/server/Games
      - server_downloads:/server/Downloads
    environment:
      ENABLE_RELOAD: "true"
      CONFIG_PATH: /app/config.yaml
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
      VITE_HOST: "0.0.0.0"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata_django:
  redis_data:
  bot_logs:
  frontend_node_modules:
  server_games:
    driver: local
    driver_opts:
      type: cifs
      device: "//SERVER/Games"
      o: "guest,noperm,vers=3.0,iocharset=utf8"
  server_downloads:
    driver: local
    driver_opts:
      type: cifs
      device: "//SERVER/Downloads"
      o: "guest,noperm,vers=3.0,iocharset=utf8"
