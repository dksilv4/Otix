# Otix — local development compose
# All services read DATABASE_URL, REDIS_URL, etc. from .env

services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: otix
      POSTGRES_PASSWORD: password
      POSTGRES_DB: otix_dev
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=50
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=5242kB
      -c huge_pages=off
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    volumes:
      # Fresh volume for the Django cutover; the legacy alembic `otix_pgdata`
      # volume is intentionally left orphaned (never mounted) so the FastAPI
      # schema + data stay intact until a real data migration.
      - pgdata_django:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otix -d otix_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file: ./.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Override .env's asyncpg FastAPI URL — Django's parser only accepts
      # plain postgresql:// (see config/settings/base.py parse_database_url).
      DATABASE_URL: postgresql://otix:password@db:5432/otix_dev
      ENABLE_RELOAD: "true"
    command: bash entrypoints/start-api.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  # ── Celery worker + beat ──
  # The Django task surface is small so far (run_sync_job on the default
  # queue); the worker consumes `celery` only. As task-#6 machinery (ingest/
  # enrich/embedding queues) lands, grow -Q here to match. Beat has no entries
  # yet (CELERY_BEAT_SCHEDULE is empty) and simply idles.

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file: ./.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgresql://otix:password@db:5432/otix_dev
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A config worker -Q celery -c 2 -n otix-worker@%h --loglevel INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file: ./.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgresql://otix:password@db:5432/otix_dev
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A config beat --loglevel INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  bots:
    build:
      context: .
      dockerfile: bots/Dockerfile
    environment:
      BOT_API_BASE_URL: http://api:8000/api/v1
      BOT_COUNT: "0"
      BOT_ACTIVE_POOL: "30"
      BOT_ACTION_BURST: "3"
      BOT_COOLDOWN_MIN: "30"
      BOT_COOLDOWN_MAX: "60"
      BOT_DELAY_MIN: "3"
      BOT_DELAY_MAX: "15"
      BOT_STARTUP_STAGGER: "120"
      BOT_API_TIMEOUT: "45"
      BOT_HTTP_POOL_LIMIT: "300"
      BOT_HTTP_POOL_PER_HOST: "200"
      BOT_LOG_DIR: /app/logs
    volumes:
      - bot_logs:/app/logs
    depends_on:
      - api

volumes:
  pgdata_django:
  redis_data:
  bot_logs:
