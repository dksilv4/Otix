# Pre-commit hooks for Otix
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Skip in emergency: git commit --no-verify

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--config, backend/pyproject.toml]
        files: ^backend/
      - id: ruff-format
        args: [--config, backend/pyproject.toml]
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-lint
        name: ESLint (frontend)
        entry: bash -c 'cd frontend && npx eslint --fix --no-warn-ignored src/'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: version-check
        name: Version bump required
        entry: bash scripts/check-versions.sh
        language: system
        pass_filenames: false
        always_run: true
