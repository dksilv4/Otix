# Otix — production compose file (Django backend only).
x-otix-env: &otix-env
  # ── Django run env (config/settings.prod; fails fast without SECRET_KEY /
  # ALLOWED_HOSTS) ──
  DJANGO_SETTINGS_MODULE: config.settings.prod
  APP_ENV: production
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  # TLS is terminated by the edge proxy/reverse proxy; Django itself must not
  # redirect the container's internal HTTP healthcheck. Set to true when the
  # proxy forwards X-Forwarded-Proto and you want an app-level redirect.
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
  # ── Database (via pgbouncer pooler). Django parses plain postgresql:// only
  # (no +asyncpg). psycopg3 + transaction pooling needs no persistent conns,
  # which is Django's default (CONN_MAX_AGE=0). ──
  DATABASE_URL: postgresql://${POSTGRES_USER:-otix}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-otix}
  # ── Redis (broker/result-backend + SSE pub/sub) ──
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  # ── CORS / browser ──
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  # Action/email links (registration, 2FA, reset) point at the public frontend
  # origin; set alongside FRONTEND_BASE_URL.
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  # ── Provider keys ──
  TMDB_API_KEY: ${TMDB_API_KEY}
  TMDB_RAT: ${TMDB_RAT}                  # TMDB v4 read-access token
  OMDB_API_KEY: ${OMDB_API_KEY}
  FANART_API_KEY: ${FANART_API_KEY}
  LASTFM_API_KEY: ${LASTFM_API_KEY}
  IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
  IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
  STEAM_API_KEY: ${STEAM_API_KEY}
  STEAM_GRID_API_KEY: ${STEAM_GRID_API_KEY}   # SteamGridDB alias read by Django
  MUSICBRAINZ_GLOBAL_RPS_LIMIT: ${MUSICBRAINZ_RPS_LIMIT:-1}
  # ── Google OAuth ──
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # ── Plex ──
  PLEX_CLIENT_IDENTIFIER: ${PLEX_CLIENT_IDENTIFIER:-otix-web}
  PLEX_PRODUCT: ${PLEX_PRODUCT:-Otix}
  PLEX_VERSION: ${PLEX_VERSION:-0.1.0}
  # ── Email (Django SMTP backend; unset EMAIL_HOST → localhost:25 like Django's
  # default). Registration/2FA links use FRONTEND_URL above. ──
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-25}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
  # ── Plugin host (server-side plugins; the host process is deployed separately
  # from the compose API/worker/beat — loopback-only secret, see deploy/). ──
  PLUGIN_HOST_SECRET: ${PLUGIN_HOST_SECRET:-dev-plugin-host-secret-change-me}
  # ── Image uploads ──
  UPLOAD_DIR: /app/uploads
  UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-5}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-otix}
      POSTGRES_USER: ${POSTGRES_USER:-otix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c jit=off
      -c shared_buffers=384MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c default_statistics_target=500
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_wal_size=2GB
      -c min_wal_size=512MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-otix} -d ${POSTGRES_DB:-otix}"]
      interval: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500M

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-otix}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-otix}
      LISTEN_ADDR: "0.0.0.0"
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "25"
      MAX_CLIENT_CONN: "150"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      AUTH_TYPE: scram-sha-256
      SERVER_IDLE_TIMEOUT: "300"
      CLIENT_IDLE_TIMEOUT: "600"
      QUERY_TIMEOUT: "300"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "pgbouncer"]
      interval: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 400mb --maxmemory-policy allkeys-lru --save 60 1 --timeout 120 --tcp-keepalive 60 --maxclients 20000
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli debug sleep 0"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - redisdata:/data

  # Django ASGI (uvicorn config.asgi). Runs `manage.py migrate` on boot unless
  # RUN_MIGRATIONS=false; the reverse proxy terminates TLS and routes /api to
  # this service. Health probe hits /api/v1/health (no DB dependency).
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *otix-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    command: bash entrypoints/start-api.sh
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M

  # Django Celery worker (single `celery` queue — the whole task surface is
  # run_sync_job + the beat catalog jobs; purpose-built per-queue routing stays
  # deferred with task-#6). The legacy four-worker multi-queue topology is gone.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *otix-env
    command: celery -A config worker -Q celery -c ${CELERY_WORKER_CONCURRENCY:-4} -n otix-worker@%h --loglevel WARNING --max-tasks-per-child 100
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping 2>&1 | grep -q OK || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Django Celery beat. Drives the catalog maintenance schedule from settings
  # (CELERY_BEAT_SCHEDULE): the daily TMDB ID-export import + backlog drain.
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *otix-env
    command: celery -A config beat --loglevel INFO --max-interval 30
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping 2>&1 | grep -q OK || kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
    volumes:
      - frontend_static:/usr/share/nginx/html
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  redisdata:
  uploads:
  frontend_static:
